name: sync-notion

on:
  # Enable this AFTER a successful `--dry-run` and a successful `--full` run via
  # workflow_dispatch. Until then the sync is manual only, so merging this file
  # can't fire a live write against Notion.
  # push:
  #   branches: [main]
  #   paths: ['content/**']
  workflow_dispatch:
    inputs:
      full:
        description: 'Force a full resync (ignore sync hashes)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run — report what would change, write nothing'
        type: boolean
        default: false

# Never two syncs at once; queue them instead of cancelling, so a merge is
# never dropped halfway through.
concurrency:
  group: notion-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      - name: Push content to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PLACES_DS_ID: ${{ vars.NOTION_PLACES_DS_ID }}
          NOTION_EXPERIENCES_DS_ID: ${{ vars.NOTION_EXPERIENCES_DS_ID }}
          NOTION_NEIGHBORHOODS_DS_ID: ${{ vars.NOTION_NEIGHBORHOODS_DS_ID }}
          FULL: ${{ inputs.full }}
        run: node src/sync-notion.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Regenerate README
        if: ${{ !inputs.dry_run }}
        run: node src/build-readme.mjs

      - name: Commit README if it changed
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- README.md versions/README.en.md; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md versions/README.en.md
          git commit -m "docs: regenerate README from content [skip ci]"
          git push

      - name: Open or update a sync-failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Notion sync is failing';
            const body = [
              `The \`sync-notion\` workflow failed on \`${context.sha.slice(0, 7)}\`.`,
              '',
              `[View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'Most common causes, in order:',
              '1. `NOTION_TOKEN` expired, or the integration lost access to the parent page (page ⋯ → Connections).',
              '2. A taxonomy value reached Notion as an option it rejects — the log names the file and property.',
              '3. The workspace hit its block limit (the log says so explicitly if this is it).',
              '',
              'Content in the repo is unaffected: hashes only advance on a successful write, so a re-run resumes.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-failure',
            });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['sync-failure'] });
            }
