    - Thời gian chèo tầm 2 tiếng hoặc hơn. Được cung cấp túi chống nước để mang theo đồ, hoặc để trên bờ.
    - Chèo SUP mùa hè là trải nghiệm rất tuyệt: biển êm, nước mát, view đỉnh cao núi Sơn Trà. Ngoài ra có thể chèo ra Hòn Sụp ngắm san hô 😎😎

