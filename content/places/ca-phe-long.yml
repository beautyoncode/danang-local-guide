    - Cafe lâu đời nhất ngay trung tâm TP, hơn 30 năm.
    - Quán không bao giờ vắng khách, chủ yếu lứa khách trung trung, có hút thuốc.
    - Đặc biệt quán có các cô chú làm lâu năm, phục vụ toàn thời gian, có nơi ở tại quán + đóng bảo hiểm như công việc toàn thời gian.
  en: Oldest cafe in the city center (30+ years); always busy, mostly middle-aged locals. Smoking allowed. Long-serving staff work full-time with housing and insurance.
