why_we_go:
  vi: |-
    - Tập trung tại quán nước Ghềnh Bàng. Đi đến cuối đường lên Intercon sẽ thấy 1 trạm gác; nhìn bên phải có đường vào 1 quán cafe nhỏ (nhiều cây bàng).
    - Gửi xe và hỏi thăm, sẽ có lối đi vào rừng. Leo núi khoảng 15 – 20 phút là đến Ghềnh Bàng. Đường núi khó đi nên mang theo nước, mũ, giày thể thao.
    - Đường trong rừng khá mát; xuống Ghềnh Bàng rất hoang sơ và đẹp. Có thể mang thêm đồ ăn để nghỉ ngơi.
    - Hạn chế trêu chọc đàn khỉ vì chúng khá hung. Hạn chế tắm biển vì không có cứu hộ.
  en: 15–20 min hike through cool forest to a wild, quiet cove. Bring water, a hat and sneakers. Don't tease the monkeys (aggressive); avoid swimming - no lifeguards.
