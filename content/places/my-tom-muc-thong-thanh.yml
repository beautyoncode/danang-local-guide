why_we_go:
  vi: |-
    - Ngon tuyệt sau khi chèo SUP, tắm biển. Ngon số 2 sau khi chạy vòng Sơn Trà rồi ghé vào ăn.
    - Mực tươi rói siêu ngon. Nếu sợ đen miệng thì nói bỏ túi mực (bình thường họ không lấy ra — để cho ngọt nước).
  en: Great after SUP or a swim, second best after a ride around Son Tra. Very fresh squid - ask them to remove the ink sac if you don't want a black mouth (they normally leave it in for sweetness).
